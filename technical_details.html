  }
  function sync(){

    const running=playing||(stepping&&!stepPaused);

    query('[data-play]').setAttribute('aria-label',running?'Pause animation':'Play animation');query('[data-play]').setAttribute('aria-pressed',String(running));
    query('[data-next]').disabled=(stepping&&!stepPaused)||(busy&&playing)||phase==='complete';query('[data-reset]').disabled=busy;

  function pause(keepSegment=false){contextAnimations.forEach(animation=>animation.pause());playing=false;stepPaused=stepping;clearTimeout(timer);timer=null;if(!keepSegment)outputVideo.pause();sync();}

    pool=[...inputs];segments=[];selected=[...inputs];index=0;displayedIndex=-1;blockSize=Math.min(BLOCK_FRAMES,frames.length);phase='prefill-inputs';tokens.clear();motionContext=[];retrievedContext=[];pendingMotion=[];motionSourceBounds=[];outgoingMotionCount=0;mount();showSelected();

  outputVideo.addEventListener('ended',()=>{segmentResolve?.();segmentResolve=null;sync();});
